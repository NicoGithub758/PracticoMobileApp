<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  
  <!-- Círculo de fondo verde -->
  <circle cx="100" cy="100" r="90" fill="#6B8E5A"/>
  <circle cx="100" cy="100" r="85" fill="#FFFFFF"/>
  
  <!-- Pelota de fútbol estilizada en el medio -->
  <g transform="translate(100, 80)">
    <circle cx="0" cy="0" r="30" fill="#FFFFFF" stroke="#2C3E2D" stroke-width="2.5"/>
    <polygon points="0,-19 15,-7 9,11 -9,11 -15,-7" fill="#2C3E2D"/>
    <line x1="-19" y1="0" x2="-30" y2="0" stroke="#2C3E2D" stroke-width="2"/>
    <line x1="19" y1="0" x2="30" y2="0" stroke="#2C3E2D" stroke-width="2"/>
    <line x1="0" y1="19" x2="0" y2="30" stroke="#2C3E2D" stroke-width="2"/>
  </g>

  <!-- Texto "PencaUY" abajo -->
  <text x="100" y="150" 
        font-family="Georgia, serif" 
        font-size="22" 
        font-weight="bold" 
        text-anchor="middle"
        fill="#2C3E2D">Penca<tspan fill="#6B8E5A">UY</tspan></text>
  
  <!-- 3 estrellitas decorativas -->
  <g fill="#6B8E5A">
    <polygon points="80,170 82,174 86,174 83,177 85,181 80,178 75,181 77,177 74,174 78,174"/>
    <polygon points="100,170 102,174 106,174 103,177 105,181 100,178 95,181 97,177 94,174 98,174"/>
    <polygon points="120,170 122,174 126,174 123,177 125,181 120,178 115,181 117,177 114,174 118,174"/>
  </g>

</svg>
